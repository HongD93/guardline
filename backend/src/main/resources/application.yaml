spring:
  application:
    name: guardline
  config:
    # 로컬 시크릿은 커밋되지 않는 backend/application-local.yaml로 분리한다. 없으면 무시된다.
    import: optional:file:./application-local.yaml

server:
  port: 8080

guardline:
  assemblyai:
    api-key: ${ASSEMBLYAI_API_KEY:}
    endpoint: wss://streaming.assemblyai.com/v3/ws
    # 프론트가 리샘플해 보내는 값과 반드시 같아야 한다. 바꾸면 프론트 상수도 함께 바꾼다.
    sample-rate: 16000
    # 스트리밍 기본값이 PCM16 LE 모노다. 공식 예제도 싣지 않으므로 비워둔다.
    encoding: ${ASSEMBLYAI_ENCODING:}
    # universal-3-5-pro는 한국어를 지원하지 않는다(18개 언어에 ko 없음). 한국어 오디오를 넣으면
    # 중국어·일본어·힌디어 등 아는 언어로 매핑해버린다. whisper-rt만 한국어를 지원한다.
    speech-model: ${ASSEMBLYAI_SPEECH_MODEL:whisper-rt}
    # whisper-rt는 언어 파라미터를 받지 않고 자동 감지한다. 비워둔다.
    language-code: ${ASSEMBLYAI_LANGUAGE_CODE:}
    # 화자 분리. whisper-rt는 이 파라미터를 수락하지만 실제로는 분리하지 않고 전 구간을
    # 화자 A로 반환한다(실측). 남녀 음성으로 바꿔 재현해도 동일했다. 지원이 확인되면 켠다.
    speaker-labels: false
    # 전사 정확도를 높일 도메인 용어. 보이스피싱 통화에 반복해서 나오는 표현들이다.
    keyterms:
      - 대포통장
      - 자금세탁
      - 명의도용
      - 체포영장
      - 안전계좌
      - 국가안전계좌
      - 수사기밀
      - 피의자
      - 검찰청
      - 금융감독원
      - 이상거래탐지
      - 보이스피싱
  llm:
    # STT와 같은 API 키를 쓴다. 별도 시크릿이 없다.
    endpoint: https://llm-gateway.assemblyai.com/v1/chat/completions
    # 모델 ID는 날짜 접미사까지 정확히 맞아야 한다. 무료 크레딧 계정은 이 모델만 접근 가능하고
    # 다른 모델은 400 "does not have access"가 난다. 접근 가능 목록은 GET /v1/models로 확인한다.
    model: ${GUARDLINE_LLM_MODEL:qwen3.5-4b-32k-fast}
    max-tokens: 1024
    timeout-ms: 8000
    # 무료 계정 레이트 리밋이 빡빡해서(429) 짧게 잡으면 대부분의 판정 회차가 버려진다.
    # 통화 전체를 매번 다시 검사하므로 간격이 길어도 뒤늦게 나온 단계를 놓치지 않는다.
    interval-ms: 10000
    # 판정에 넘길 확정 문장 수. 통화 전체를 매번 다시 검사해야 뒤늦게 나온 단계도 잡힌다.
    window-lines: 60

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175}

logging:
  level:
    com.guardline: DEBUG
